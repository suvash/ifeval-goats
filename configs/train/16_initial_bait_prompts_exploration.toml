name = "initial-bait-prompts-exploration-v1-shape-016"
model = "meta-llama/Llama-3.2-1B-Instruct"
loss = "rl"

max_steps = 20
batch_size = 24
rollouts_per_example = 2

[sampling]
max_tokens = 512
temperature = 0.7

[[env]]
name = "ifeval-goats"
taskset = { id = "suvash/ifeval-goats@0.1.13" }
harness = { id = "suvash/ifeval-goats@0.1.13", runtime = { type = "prime" } }

[eval]
interval = 10
num_examples = 12
rollouts_per_example = 1
skip_first_step = false

[[eval.env]]
name = "ifeval-goats"
taskset = { id = "suvash/ifeval-goats@0.1.13" }
harness = { id = "suvash/ifeval-goats@0.1.13", runtime = { type = "prime" } }
num_examples = 12
group_size = 1
