name = "lets_get_goating"
model = "meta-llama/Llama-3.2-1B-Instruct"
max_steps = 100

batch_size = 128
rollouts_per_example = 8
learning_rate = 0.00003

[sampling]
max_tokens = 2048
temperature = 0.7

[[env]]
name = "ifeval-goats"
taskset = { id = "suvash/ifeval-goats@0.1.28" }
harness = { id = "suvash/ifeval-goats@0.1.28", runtime = { type = "prime", vm = true } }

[eval]
interval = 25
num_examples = -1
rollouts_per_example = 2
skip_first_step = false

[eval.sampling]
max_tokens = 2048
temperature = 0.7

[[eval.env]]
name = "ifeval-goats"
taskset = { id = "suvash/ifeval-goats@0.1.28" }
harness = { id = "suvash/ifeval-goats@0.1.28", runtime = { type = "prime", vm = true } }
num_examples = -1
group_size = 2

[checkpoints]
interval = 25
keep_cloud = 4
