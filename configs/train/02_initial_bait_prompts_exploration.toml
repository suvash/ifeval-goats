name = "initial-bait-prompts-exploration-v016"
model = "meta-llama/Llama-3.2-1B-Instruct"
loss = "rl"

max_steps = 20
batch_size = 24
rollouts_per_example = 2

[sampling]
max_tokens = 512
temperature = 0.7

[[env]]
id = "suvash/ifeval-goats"
version = "0.1.6"

[eval]
interval = 10
num_examples = 12
rollouts_per_example = 1
skip_first_step = false

[[eval.env]]
id = "suvash/ifeval-goats"
version = "0.1.6"
num_examples = 12
rollouts_per_example = 1
