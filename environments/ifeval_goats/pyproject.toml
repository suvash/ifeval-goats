[project]
name = "ifeval-goats"
description = "Neutral IFEval-style reward-hacking environment with a hidden goat reward."
version = "0.1.28"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ifeval_goats"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
